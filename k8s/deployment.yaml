apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-bill-deployment
  labels:
    app: shopping-bill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-bill
  template:
    metadata:
      labels:
        app: shopping-bill
    spec:
      containers:
      - name: billing-runtime
        image: thirukumaran24/shopping-bill:CHANGEME
        stdin: true
        tty: true
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-bill-service
spec:
  type: NodePort
  selector:
    app: shopping-bill
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
